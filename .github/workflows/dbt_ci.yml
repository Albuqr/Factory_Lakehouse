name: dbt CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  dbt-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Set up GCP credentials
        env:
          GCP_CREDS: ${{ secrets.GCP_CREDENTIALS }}
        run: |
          echo "$GCP_CREDS" > gcp-credentials.json

      - name: Set up dbt profiles
        env:
          DBT_PROF: ${{ secrets.DBT_PROFILES }}
        run: |
          mkdir -p ~/.dbt
          echo "$DBT_PROF" > ~/.dbt/profiles.yml

      - name: Install dbt packages
        run: dbt deps
        env:
          GOOGLE_APPLICATION_CREDENTIALS: gcp-credentials.json

      - name: Run dbt seed
        run: dbt seed --target ci
        env:
          GOOGLE_APPLICATION_CREDENTIALS: gcp-credentials.json

      - name: Run dbt run
        run: dbt run --target ci
        env:
          GOOGLE_APPLICATION_CREDENTIALS: gcp-credentials.json

      - name: Run dbt tests
        run: dbt test --target ci
        env:
          GOOGLE_APPLICATION_CREDENTIALS: gcp-credentials.json
          
      - name: Drop CI dataset
        if: always()
        run: |
          gcloud auth activate-service-account --key-file=gcp-credentials.json
          bq rm -r -f -d factory-lakehouse:factory_lakehouse_ci
        env:
          GOOGLE_APPLICATION_CREDENTIALS: gcp-credentials.json
