name: dbt CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
jobs:
  dbt-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Set up GCP credentials
        run: |
          echo '${{ secrets.GCP_CREDENTIALS }}' > gcp-credentials.json

      - name: Set up dbt profiles
        run: |
          mkdir -p ~/.dbt
          echo '${{ secrets.DBT_PROFILES }}' > ~/.dbt/profiles.yml

      - name: Install dbt packages
        run: dbt deps
        env:
          GOOGLE_APPLICATION_CREDENTIALS: gcp-credentials.json

      - name: Run dbt seed
        run: dbt seed --target ci
        env:
          GOOGLE_APPLICATION_CREDENTIALS: gcp-credentials.json

      - name: Run dbt run
        run: dbt run --target ci
        env:
          GOOGLE_APPLICATION_CREDENTIALS: gcp-credentials.json

      - name: Run dbt tests
        run: dbt test --target ci
        env:
          GOOGLE_APPLICATION_CREDENTIALS: gcp-credentials.json
          
      - name: Drop CI dataset
        if: always()
        run: bq rm -r -f -d factory_lakehouse_ci
        env:
          GOOGLE_APPLICATION_CREDENTIALS: gcp-credentials.json
